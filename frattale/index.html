<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Frattale</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #gl {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        cursor: crosshair;
      }
      /* Controlli touch, sempre visibili. Stick a sinistra = orbita
         intorno al centro (2 assi). Levetta a destra = avvicina/allontana
         dal centro (1 solo asse): forma deliberatamente diversa da uno
         stick, per segnalare che governa una cosa sola. Si illuminano
         leggermente quando in uso. */
      #touch-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .stick-base {
        position: absolute;
        left: max(28px, env(safe-area-inset-left));
        bottom: max(28px, env(safe-area-inset-bottom));
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 1.5px solid rgba(220, 210, 240, 0.3);
        background: rgba(220, 210, 240, 0.05);
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .stick-base.active {
        border-color: rgba(220, 210, 240, 0.6);
        background: rgba(220, 210, 240, 0.1);
      }
      .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        background: rgba(220, 210, 240, 0.45);
        transition: transform 0.05s linear;
      }
      .stick-base.active .stick-knob {
        background: rgba(220, 210, 240, 0.7);
      }

      .lever-track {
        position: absolute;
        right: max(40px, env(safe-area-inset-right));
        bottom: max(28px, env(safe-area-inset-bottom));
        width: 48px;
        height: 158px;
        border-radius: 24px;
        border: 1.5px solid rgba(220, 210, 240, 0.3);
        background: rgba(220, 210, 240, 0.05);
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .lever-track.active {
        border-color: rgba(220, 210, 240, 0.6);
        background: rgba(220, 210, 240, 0.1);
      }
      .lever-track::before {
        /* segno "vicino" in alto */
        content: "";
        position: absolute;
        left: 50%;
        top: 14px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        border-radius: 50%;
        border: 1.5px solid rgba(220, 210, 240, 0.35);
      }
      .lever-track::after {
        /* segno "lontano" in basso */
        content: "";
        position: absolute;
        left: 50%;
        bottom: 14px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        border-radius: 50%;
        background: rgba(220, 210, 240, 0.35);
      }
      .lever-handle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 38px;
        height: 38px;
        margin: -19px 0 0 -19px;
        border-radius: 12px;
        background: rgba(220, 210, 240, 0.5);
        transition: transform 0.05s linear;
      }
      .lever-track.active .lever-handle {
        background: rgba(220, 210, 240, 0.75);
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="touch-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
