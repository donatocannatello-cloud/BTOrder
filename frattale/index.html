<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Frattale</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #gl {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        cursor: crosshair;
      }
      /* Joystick touch: sempre visibili e ancorati agli angoli, cosi' e'
         chiaro a colpo d'occhio dove toccare (muovi a sinistra, guarda a
         destra). Si illuminano leggermente quando in uso. */
      #touch-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .joy-base {
        position: absolute;
        bottom: max(28px, env(safe-area-inset-bottom));
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 1.5px solid rgba(220, 210, 240, 0.3);
        background: rgba(220, 210, 240, 0.05);
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .joy-base.active {
        border-color: rgba(220, 210, 240, 0.6);
        background: rgba(220, 210, 240, 0.1);
      }
      .joy-move {
        left: max(28px, env(safe-area-inset-left));
      }
      .joy-look {
        right: max(28px, env(safe-area-inset-right));
      }
      .joy-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        background: rgba(220, 210, 240, 0.45);
        transition: transform 0.05s linear;
      }
      .joy-base.active .joy-knob {
        background: rgba(220, 210, 240, 0.7);
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="touch-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
