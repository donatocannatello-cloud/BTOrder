name: Build MenuMostro Release AAB

# Da avviare a mano (tab Actions -> questo workflow -> "Run workflow") solo
# quando serve generare un nuovo .aab firmato da caricare su Google Play
# Console. A differenza della build di debug, questa non parte ad ogni push:
# richiede i 4 secret RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD /
# RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD configurati nel repository
# (Settings > Secrets and variables > Actions), altrimenti fallisce subito.
on:
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        working-directory: MenuMostro
        run: chmod +x gradlew

      - name: Decodifica il keystore di release
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Manca il secret RELEASE_KEYSTORE_BASE64: vedi CREDENZIALI_FIRMA_RELEASE.txt per come configurarlo." >&2
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/MenuMostro/release.keystore"

      - name: Build AAB firmato
        working-directory: MenuMostro
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/MenuMostro/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: rm -f "${{ github.workspace }}/MenuMostro/release.keystore"

      - name: Upload AAB firmato
        uses: actions/upload-artifact@v4
        with:
          name: free-bimbo-games-release-aab
          path: MenuMostro/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
