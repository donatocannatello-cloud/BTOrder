name: Build APK

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Android SDK (platform-tools, platform 34, build-tools 34)
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Calcola numero di build e SHA corto per il versionamento
        run: echo "SHA_CORTO=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Compila l'APK di debug
        env:
          BTORDER_VERSION_CODE: ${{ github.run_number }}
          BTORDER_VERSION_NAME: "build ${{ github.run_number }} (${{ env.SHA_CORTO }})"
        run: ./gradlew :app:assembleDebug

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BTOrder-debug.apk

      - name: Carica APK BTOrder
        uses: actions/upload-artifact@v4
        with:
          name: BTOrder-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Pubblica su una Release fissa (link diretto sempre aggiornato)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "BTOrder (debug) - build automatica"
          body: >
            APK di debug generato automaticamente dall'ultimo commit su
            ${{ github.ref_name }} (${{ github.sha }}) — build ${{ github.run_number }}
            (${{ env.SHA_CORTO }}), visibile anche nell'app in Impostazioni.
            Scarica BTOrder-debug.apk qui sotto e installalo: essendo firmato
            sempre con la stessa chiave di debug, si aggiorna sopra la
            versione già installata senza bisogno di disinstallarla prima.
          prerelease: true
          files: BTOrder-debug.apk
