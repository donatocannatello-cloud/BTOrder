name: Build APK

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Compila l'APK di debug
        run: ./gradlew :app:assembleDebug

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BTOrder-debug.apk

      - name: Carica APK BTOrder
        uses: actions/upload-artifact@v4
        with:
          name: BTOrder-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Pubblica su una Release fissa (link diretto sempre aggiornato)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "BTOrder (debug) - build automatica"
          body: >
            APK di debug generato automaticamente dall'ultimo commit su
            ${{ github.ref_name }} (${{ github.sha }}).
            Scarica BTOrder-debug.apk qui sotto e installalo: essendo firmato
            sempre con la stessa chiave di debug, si aggiorna sopra la
            versione già installata senza bisogno di disinstallarla prima.
          prerelease: true
          files: BTOrder-debug.apk
