name: Build MenuMostro APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "MenuMostro/**"
      - ".github/workflows/build-menumostro.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        working-directory: MenuMostro
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: MenuMostro
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp MenuMostro/app/build/outputs/apk/debug/app-debug.apk dist/MenuMostro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menu-mostro-debug-apk
          path: dist/MenuMostro-debug.apk
          if-no-files-found: error

      # Pubblica l'APK come asset di una Release con tag fisso: a differenza degli
      # artifact delle Actions (sempre zippati e scaricabili solo da chi ha accesso
      # al repo/API), l'asset di una Release è un link diretto al singolo file .apk,
      # stabile nel tempo e scaricabile pubblicamente da un repository pubblico.
      # Il tag viene ricreato ad ogni build così il link resta sempre lo stesso.
      - name: Pubblica la Release con l'APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release delete menu-mostro-latest --yes --cleanup-tag || true
          gh release create menu-mostro-latest dist/MenuMostro-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Menù del Mostro (debug) - build ${{ github.run_number }}" \
            --notes "APK di debug generato automaticamente dal commit ${{ github.sha }}. Firmato con il keystore di debug versionato: installa sopra la versione precedente senza disinstallare."
