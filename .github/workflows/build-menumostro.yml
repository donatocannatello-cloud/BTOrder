name: Build MenuMostro APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "MenuMostro/**"
      - ".github/workflows/build-menumostro.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        working-directory: MenuMostro
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: MenuMostro
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menu-mostro-debug-apk
          path: MenuMostro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
