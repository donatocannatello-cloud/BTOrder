name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: ./gradlew --no-daemon :theremin:testDebugUnitTest

      - name: Compila APK di debug
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: theremin-cromatico-debug-apk
          path: theremin/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chiamatebt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Link diretto e stabile all'ultimo APK del theremin:
      # https://github.com/<owner>/<repo>/releases/download/theremin-latest/theremin-cromatico-debug.apk
      - name: Prepara APK per la release
        if: github.event_name != 'pull_request'
        run: cp theremin/build/outputs/apk/debug/theremin-debug.apk theremin-cromatico-debug.apk

      - name: Pubblica APK nella release "theremin-latest"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theremin-latest
          name: Theremin Cromatico (ultima build)
          prerelease: true
          files: theremin-cromatico-debug.apk
