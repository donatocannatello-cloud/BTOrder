name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: ./gradlew --no-daemon :theremin:testDebugUnitTest

      - name: Compila APK di debug
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: theremin-cromatico-debug-apk
          path: theremin/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chiamatebt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
