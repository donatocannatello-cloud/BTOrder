name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Chiave di caricamento per il Play Store, dai Secrets del repository (mai nel codice)
      THEREMIN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.THEREMIN_UPLOAD_KEYSTORE_BASE64 }}
      THEREMIN_UPLOAD_STORE_PASSWORD: ${{ secrets.THEREMIN_UPLOAD_STORE_PASSWORD }}
      THEREMIN_UPLOAD_KEY_ALIAS: ${{ secrets.THEREMIN_UPLOAD_KEY_ALIAS }}
      THEREMIN_UPLOAD_KEY_PASSWORD: ${{ secrets.THEREMIN_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: ./gradlew --no-daemon :theremin:testDebugUnitTest :forme:testDebugUnitTest

      - name: Compila APK di debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Versione di MediaPipe usata
        run: ./gradlew --no-daemon -q :theremin:dependencies --configuration releaseRuntimeClasspath | grep -m1 "tasks-vision" || true

      - name: Controllo librerie native a 16 KB (requisito Google Play)
        run: python3 .github/scripts/controlla_16kb.py theremin/build/outputs/apk/debug/theremin-debug.apk || echo "::warning::Librerie native non compatibili con pagine da 16 KB"

      - name: Compila AAB firmato per il Play Store
        if: github.event_name != 'pull_request' && env.THEREMIN_UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$THEREMIN_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export THEREMIN_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon :theremin:bundleRelease
          cp theremin/build/outputs/bundle/release/theremin-release.aab theremin-cromatico-release.aab
          rm "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: theremin-cromatico-debug-apk
          path: theremin/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: incastra-le-forme-debug-apk
          path: forme/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chiamatebt-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Link diretto e stabile all'ultimo APK del theremin:
      # https://github.com/<owner>/<repo>/releases/download/theremin-latest/theremin-cromatico-debug.apk
      - name: Prepara APK per la release
        if: github.event_name != 'pull_request'
        run: cp theremin/build/outputs/apk/debug/theremin-debug.apk theremin-cromatico-debug.apk

      - name: Pubblica APK nella release "theremin-latest"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theremin-latest
          name: Theremin Cromatico (ultima build)
          prerelease: true
          # L'AAB (se c'è la chiave nei Secrets) è il file da caricare su Google Play Console
          files: |
            theremin-cromatico-debug.apk
            theremin-cromatico-release.aab

      # Link diretto e stabile all'ultimo APK del gioco delle forme:
      # https://github.com/<owner>/<repo>/releases/download/forme-latest/incastra-le-forme-debug.apk
      - name: Prepara APK del gioco per la release
        if: github.event_name != 'pull_request'
        run: cp forme/build/outputs/apk/debug/forme-debug.apk incastra-le-forme-debug.apk

      - name: Pubblica APK nella release "forme-latest"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forme-latest
          name: Incastra le Forme (ultima build)
          prerelease: true
          files: incastra-le-forme-debug.apk
